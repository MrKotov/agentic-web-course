name: CI — platform

on:
  push:
    branches: [main]
    paths:
      - "apps/platform/**"
      - ".github/workflows/ci-platform.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/platform/**"
      - ".github/workflows/ci-platform.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run pytest
