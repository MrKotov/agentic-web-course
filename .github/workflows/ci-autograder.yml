name: CI — autograder

on:
  push:
    branches: [main]
    paths:
      - "packages/autograder/**"
      - ".github/workflows/ci-autograder.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/autograder/**"
      - ".github/workflows/ci-autograder.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/autograder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"
      # Explicit --python pin: requires-python = ">=3.13" also matches newer 3.x, and
      # the action's python-version input alone doesn't force uv to use it for sync.
      - run: uv sync --extra dev --python 3.13
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run pytest
