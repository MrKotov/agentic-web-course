name: CI — site

# Builds the site on every push/PR touching it, independent of the Pages deploy in
# deploy-site.yml — this catches a broken build on a PR before it ever reaches main.

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/ci-site.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/ci-site.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
