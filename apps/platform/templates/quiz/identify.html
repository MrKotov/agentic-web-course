{% extends "base.html" %}
{% block title %}Идентификация{% endblock %}
{% block content %}
  <h1>Кой си ти?</h1>
  <p class="muted">Въведи университетския си имейл. Ще го запомним на това устройство.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="email" class="muted">Университетски имейл</label>
    <input id="email" name="email" type="email" inputmode="email" autocomplete="email" required autofocus>
    <button type="submit">Напред</button>
  </form>
{% endblock %}
