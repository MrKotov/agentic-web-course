[project]
name = "platform"
version = "0.1.0"
description = "Quiz and research platform for Programming for the Internet"
requires-python = ">=3.13"
dependencies = [
    "django==5.2.6",
    "psycopg[binary]==3.2.9",
    "dj-database-url==3.0.1",
    "python-dotenv==1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-django==4.11.1",
    "ruff==0.13.0",
    "black==25.1.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
